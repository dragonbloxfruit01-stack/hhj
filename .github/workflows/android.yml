name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Local AI 800
        uses: actions/checkout@v4

      - name: Checkout MobileFineTuner
        uses: actions/checkout@v4
        with:
          repository: Edge-Intelligence-Lab/MobileFineTuner
          ref: main
          path: MobileFineTuner

      - name: Apply mobile training extensions
        run: python3 training/mobile/patch_mft.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build and publish MobileFineTuner Android SDK
        working-directory: MobileFineTuner
        run: |
          bash scripts/android/build_mft_sdk_aar.sh
          bash scripts/android/publish_mft_sdk_local.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build arm64 debug APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAI800-mobile-training-foundation
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
