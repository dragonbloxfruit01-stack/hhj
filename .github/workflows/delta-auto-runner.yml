name: Delta Auto Runner APK

on:
  push:
    branches: [ main ]
    paths:
      - 'DeltaAutoRunner/**'
      - '.github/workflows/delta-auto-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delta-auto-runner-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p DeltaAutoRunner assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeltaAutoRunner-debug-apk
          path: DeltaAutoRunner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
