name: Malaysia World Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MalaysiaWorld/**"
      - ".github/workflows/malaysiaworld-android.yml"

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          cd MalaysiaWorld
          if [ -f MalaysiaWorld_Realistic_v0.3.zip ]; then
            unzip -o MalaysiaWorld_Realistic_v0.3.zip -d .
          elif [ -f project.zip ]; then
            unzip -o project.zip -d .
          fi
          test -f project.godot || { echo "Missing MalaysiaWorld/project.godot. Ensure the v0.3 project ZIP is present in MalaysiaWorld/."; exit 1; }
          mkdir -p build
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MalaysiaWorld.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          package/unique_name="com.malaysiaworld.game"
          package/name="Malaysia World"
          version/code=3
          version/name="0.3.0"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          EOF

      - name: Prepare Android SDK and Godot settings
        uses: docker://barichello/godot-ci:4.3
        with:
          args: >-
            bash -lc 'set -eux;
            mkdir -p /github/home/.config/godot /github/home/.local/share/godot/export_templates;
            cp -a /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/;
            yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses >/dev/null || true;
            sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;33.0.2" "platforms;android-33";
            cp /root/debug.keystore /github/home/debug.keystore;
            cat > /github/home/.config/godot/editor_settings-4.3.tres <<EOF
            [gd_resource type="EditorSettings" format=3]
            [resource]
            export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
            export/android/android_sdk_path = "/usr/lib/android-sdk"
            export/android/debug_keystore = "/github/home/debug.keystore"
            export/android/debug_keystore_user = "androiddebugkey"
            export/android/debug_keystore_pass = "android"
            EOF
            test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java;
            test -x /usr/lib/android-sdk/build-tools/33.0.2/apksigner;
            test -f /github/home/.local/share/godot/export_templates/4.3.stable/android_debug.apk;
            test -f /github/home/.local/share/godot/export_templates/4.3.stable/android_release.apk;
            echo "Android SDK, JDK, templates and signing config verified."'

      - name: Export APK with Godot 4.3
        uses: docker://barichello/godot-ci:4.3
        with:
          args: >-
            bash -lc 'set -eux; export HOME=/github/home; export ANDROID_HOME=/usr/lib/android-sdk; cd MalaysiaWorld; godot --headless --verbose --path . --export-debug Android build/MalaysiaWorld.apk; test -s build/MalaysiaWorld.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MalaysiaWorld-Android-APK
          path: MalaysiaWorld/build/MalaysiaWorld.apk
          if-no-files-found: error
          retention-days: 14
